<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Paper Trail</title>
<style>
  /* Palette follows Google Pay's dark surfaces: a near-black ground with
     surfaces that LIFT by getting lighter, rather than being drawn with
     borders. Borders are kept only where a card must separate from a
     same-tone neighbour. Accents are Google's own hues, which is what makes
     the app read as belonging beside GPay rather than imitating it. */
  :root {
    color-scheme: dark;
    --bg: #0b0f14;
    --surface: #161b22;        /* cards, sheets */
    --surface-2: #1d242d;      /* raised: chips, inputs, secondary buttons */
    --surface-3: #28313c;      /* pressed / hover */
    --card-bg: var(--surface);
    --card-border: #222b35;
    --text-primary: #e8eaed;   /* Google grey-100 */
    --text-muted: #9aa0a6;     /* Google grey-500, the real GPay secondary */
    --accent-blue: #8ab4f8;    /* Google blue-300, the dark-theme primary */
    --accent-blue-solid: #1a73e8;
    --accent-green: #81c995;
    --accent-amber: #fdd663;
    --accent-purple: #c58af9;
    --accent-red: #f28b82;
    --radius: 16px;            /* GPay's cards are generously rounded */
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    padding: 214px 12px 132px;
    background: var(--bg);
    color: var(--text-primary);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif;
    transition: background .15s ease;
  }
  
  /* --- Header ---------------------------------------------------- */
  header {
    /* The HackTracker overlay occupies the top ~96px of the screen on the
       loaner, which was rendering "Paper Trail" unreadable behind it. Start
       below that band rather than competing for the same pixels. */
    position: fixed;
    top: 96px; left: 0; right: 0;
    height: 52px;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    padding: 0 14px;
    z-index: 40;
  }
  h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  
  .marker {
    font-size: 10px; font-weight: 600;
    color: #4ade80; background: #16301f;
    padding: 3px 8px; border-radius: 99px;
    font-variant-numeric: tabular-nums;
  }
  .marker.npu { background: #10243d; color: #7cc0ff; }
  .marker.cpu { background: #3a2c10; color: #f5cd7a; }
  .marker.off { background: #241416; color: #f87171; }
  
  /* --- Clarity Dashboard Header --------------------------------- */
  /* One compact strip. Three tall tiles pushed every payment below the fold,
     which buried the thing the app is actually for. */
  .clarity {
    display: flex; gap: 6px; margin-bottom: 10px;
  }
  .cbox {
    flex: 1 1 0; background: var(--surface);
    border: none;
    border-radius: var(--radius-sm); padding: 10px 10px;
    /* height:auto and centred content - the boxes were inheriting a tall
       min-height from the old three-tile layout and leaving dead space. */
    display: flex; align-items: center; justify-content: center;
    gap: 6px; min-height: 0; line-height: 1.1;
  }
  .cbox .big {
    font-size: 16px; font-weight: 700;
    font-variant-numeric: tabular-nums; line-height: 1;
  }
  .cbox .lbl {
    font-size: 9px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--text-muted);
  }
  .cbox.zero .big { color: var(--accent-green); }
  .cbox.warn .big { color: var(--accent-amber); }
  .cbox.bad  .big { color: var(--accent-red); }
  .bar {
    height: 4px; background: var(--card-border);
    border-radius: 99px; margin-top: 6px; overflow: hidden;
  }
  .bar > i {
    display: block; height: 100%;
    background: var(--accent-green); border-radius: 99px;
    transition: width .4s ease;
  }
  .bar.risk > i { background: var(--accent-amber); }
  
  /* --- Chat Feed (Conversational Canvas) ------------------------ */
  .feed {
    display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;
  }
  .chatMsg {
    max-width: 90%; padding: 10px 14px; border-radius: 14px;
    font-size: 14px; line-height: 1.45; animation: fadeIn .2s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  
  .chatUser {
    align-self: flex-end; background: #2563eb; color: #fff;
    border-bottom-right-radius: 4px; margin-left: auto;
  }
  .chatLlm {
    align-self: flex-start; background: var(--card-bg);
    border: 1px solid var(--card-border); border-bottom-left-radius: 4px; margin-right: auto;
    width: 100%;
  }
  .chatLlm .q { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .chatLlm .a { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .chatLlm .rows { font-size: 12px; color: #9aa4b2; margin-top: 6px; border-top: 1px dashed #2b323c; padding-top: 6px; }
  .chatLlm.dupWarn { border-color: #5c2318; background: #2a1410; }
  .chatLlm.dupWarn .a { color: #fb923c; }

  /* --- Section Headers & Cards ---------------------------------- */
  h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--text-muted); margin: 18px 0 8px; display: flex; gap: 6px; align-items: center;
  }
  .count {
    background: #1f2630; color: #9aa4b2; border-radius: 99px;
    padding: 1px 7px; font-size: 10px; font-weight: 600;
  }
  
  .card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 9px; padding: 10px 12px; margin-bottom: 6px;
  }
  .card.pending { border-left: 3px solid var(--accent-amber); }
  .card.txn     { border-left: 3px solid var(--accent-blue); }
  .card.merged  { border-left: 3px solid var(--accent-green); }
  .card.confirm { border-left: 3px solid var(--accent-purple); }
  .card.flash   { animation: flash .9s ease-out; }
  @keyframes flash {
    0%   { background: #14532d; transform: scale(1.02); }
    100% { background: var(--card-bg); transform: scale(1); }
  }
  
  .amt { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .amt.credit { color: #4ade80; }
  .top { display: flex; align-items: baseline; gap: 8px; }
  .who { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .meta { color: var(--text-muted); font-size: 11px; margin-top: 3px; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 99px;
    background: #1f2630; color: #9aa4b2;
  }
  .badge.auto { background: #14532d; color: #4ade80; }
  .badge.p2p  { background: #3b2410; color: #fbbf24; }
  .empty { color: #5b636e; font-size: 12px; padding: 8px 2px; }
  .why { color: #6b7280; font-size: 10px; margin-top: 3px; }

  /* --- Chips ----------------------------------------------------- */
  /* Flat tonal chips, no borders - closer to Material's assist chips than the
     outlined badges they replace, and much quieter under a dense list. */
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
  .chip {
    font-size: 10px; font-weight: 500; padding: 3px 9px;
    border-radius: 99px; border: none; letter-spacing: .01em;
  }
  .chip.sms    { background: #17293d; color: var(--accent-blue); }
  .chip.upi    { background: #17293d; color: var(--accent-blue); }
  .chip.ocr    { background: #16301f; color: var(--accent-green); }
  .chip.voice  { background: #2b1f3d; color: var(--accent-purple); }
  .chip.purpose{ background: #33291a; color: var(--accent-amber); }
  .chip.none   { background: #3a1f1f; color: var(--accent-red); }

  /* --- Fixed Bottom Smart Action Bar ---------------------------- */
  .actionBar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(13,15,18,0.96); backdrop-filter: blur(14px);
    border-top: 1px solid var(--card-border); padding: 10px 12px 14px;
    z-index: 40; display: flex; flex-direction: column; gap: 8px;
  }
  /* Banner while evidence is being attached to a specific payment, so the
     next input is obviously not a new spend. */
  .attachBar {
    display: flex; align-items: center; gap: 8px;
    background: #10243d; border: 1px solid #1b3a5e;
    border-radius: 8px; padding: 7px 10px; margin-bottom: 8px;
    font-size: 12px; color: #7cc0ff;
  }
  .attachBar .aWho { flex: 1 1 auto; }
  .attachBar .aCancel {
    background: none; border: none; color: #7e8794;
    font-size: 12px; padding: 2px 6px;
  }

  .actionTop { display: flex; gap: 8px; align-items: center; }
  .actionTop input {
    flex: 1 1 auto; background: var(--surface-2); border: 1px solid transparent;
    border-radius: 99px; padding: 12px 18px; color: var(--text-primary);
    font-size: 15px; outline: none; font-family: inherit;
    transition: border-color .15s, background .15s;
  }
  .actionTop input:focus { border-color: var(--accent-blue); background: var(--surface-3); }
  .actionTop input:disabled { opacity: .5; }

  .actionBtn {
    width: 44px; height: 44px; border-radius: 22px; background: var(--surface-2);
    border: none; color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0; cursor: pointer;
    transition: background .15s;
  }
  .actionBtn:active { background: var(--surface-3); }
  /* GPay's primary is a light blue on dark with dark text, not a saturated
     blue with white text - it is the accessible pairing in a dark theme. */
  .actionBtn.primary { background: var(--accent-blue); color: #0b0f14; }
  .actionBtn.primary:active { background: #a8c7fa; }
  
  .actionTools { display: flex; gap: 8px; justify-content: space-around; }
  .actionTools button {
    background: none; border: none; color: #9aa4b2; font-size: 12px;
    display: flex; gap: 4px; align-items: center; padding: 4px 8px; cursor: pointer;
    font-family: inherit;
  }
  .actionTools button:active { color: var(--text-primary); }
  /* Scan & Pay is the product's front door - it should not look like a
     sibling of "Sync SMS". */
  .actionTools button.toolPay {
    background: var(--accent-blue); border: none; color: #0b0f14;
    border-radius: 99px; padding: 9px 18px; font-weight: 600; font-size: 13px;
  }
  .actionTools button.toolPay:active { background: #a8c7fa; color: #0b0f14; }

  /* --- Sheets ---------------------------------------------------- */
  body.camera { background: transparent; }
  body.camera > header, body.camera > .feed, body.camera > .clarity,
  body.camera > h2, body.camera > div:not(.sheet) { visibility: hidden; }
  .sheet {
    position: fixed; inset: 0; z-index: 50; display: flex;
    align-items: flex-end; justify-content: center;
  }
  .sheet.hidden { display: none; }
  .sheetInner {
    width: 100%; background: var(--card-bg); border-top: 1px solid #2b323c;
    border-radius: 16px 16px 0 0; padding: 16px 16px 24px;
    box-shadow: 0 -12px 40px rgba(0,0,0,.6);
  }
  .sheetHead {
    display: flex; align-items: center; font-size: 14px;
    font-weight: 600; margin-bottom: 10px;
  }
  .sheetHead .x { margin-left: auto; padding: 4px 10px; font-size: 16px; cursor: pointer; }
  .shotRow { display: flex; gap: 8px; margin-top: 12px; }
  .shotRow button { flex: 1 1 0; padding: 12px; border-radius: 8px; font-size: 14px; }
  .hint { color: var(--text-muted); font-size: 12px; margin: 4px 0; }
  .hint.ok { color: #4ade80; }
  .hint.err, .err { color: var(--accent-red); }

  /* --- Tabs ------------------------------------------------------- */
  .tabs {
    /* Fixed, not sticky: a sticky element inside a scrolling body still lets
       rows pass behind the header above it. */
    display: flex; gap: 6px;
    position: fixed; top: 148px; left: 0; right: 0;
    z-index: 35; background: var(--bg);
    padding: 8px 12px 10px;
    border-bottom: 1px solid var(--card-border);
  }
  /* Pill tabs on a tonal ground, Material 3 style. */
  .tab {
    flex: 1 1 0; padding: 9px 6px; font-size: 13px; font-weight: 500;
    background: var(--surface); border: none;
    border-radius: 99px; color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: background .15s, color .15s;
  }
  .tab.active { background: #1a3050; color: var(--accent-blue); font-weight: 600; }
  /* Ask before anything is explained: visibly unavailable, still tappable so
     the tab can explain itself rather than silently doing nothing. */
  .tab.locked { color: #5f6772; }
  .tabCount {
    background: var(--surface-3); color: var(--text-muted); border-radius: 99px;
    padding: 0 7px; font-size: 10px; font-weight: 700;
  }
  .tab.active .tabCount { background: var(--accent-blue); color: #0b0f14; }

  /* Ledger filters. Visually lighter than the mode tabs above them, so the
     hierarchy reads: which mode am I in, then which slice of it. */
  .filters { display: flex; gap: 6px; margin: 0 0 10px; }
  .filt {
    flex: 1 1 0; padding: 6px 6px; font-size: 11px; font-weight: 600;
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-muted); border-radius: 0;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .filt.active { color: var(--text-primary); border-bottom-color: var(--accent-blue); }

  /* --- Payment row ------------------------------------------------ */
  /* One row shape for every payment. What differs is the state stripe and
     the chips, not the section it lives in. */
  /* GPay's transaction list: no border, a leading avatar circle, and the
     amount right-aligned. The state stripe is gone - state is carried by the
     avatar's tint and the meta line, which is quieter and reads faster than
     four competing coloured edges down the left of the screen. */
  .pay {
    background: var(--surface);
    border: none; border-radius: var(--radius);
    padding: 13px 14px 13px 12px; margin-bottom: 8px;
    cursor: pointer; transition: background .15s, transform .1s;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .pay:active { transform: scale(0.99); background: var(--surface-2); }

  /* The avatar carries the state colour. */
  .payIcon {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 600; margin-top: 1px;
    background: var(--surface-3); color: var(--text-muted);
  }
  .pay.done    .payIcon { background: #1e3a29; color: var(--accent-green); }
  .pay.waiting .payIcon { background: #3a3018; color: var(--accent-amber); }
  .pay.bare    .payIcon { background: #1a2c44; color: var(--accent-blue); }
  .pay.dup     .payIcon { background: #45291a; color: #fbbf24; }
  .payMain { flex: 1 1 auto; min-width: 0; }
  .pay.dup     { background: #241a12; }
  .pay.flash   { animation: flash .9s ease-out; }

  /* Name leads, amount is right-aligned - the GPay reading order. The amount
     sitting first made every row start with a number, which is hard to scan
     when what you are looking for is who you paid. */
  .payTop { display: flex; align-items: baseline; gap: 10px; }
  .payAmt {
    font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em; flex-shrink: 0; margin-left: auto;
  }
  .payAmt.credit { color: var(--accent-green); }
  .payWho {
    flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; font-weight: 500; font-size: 14px;
  }
  .payWho.unknown { color: var(--text-muted); font-style: italic; font-weight: 400; }
  .payWhen { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .payMeta { color: var(--text-muted); font-size: 12px; margin-top: 3px; }
  .payWarn {
    font-size: 11px; color: #fb923c; margin-top: 5px;
    display: flex; gap: 5px; align-items: center;
  }

  /* --- Detail sheet ----------------------------------------------- */
  /* Above the header and tabs: a modal that leaves chrome floating on top of
     its own backdrop reads as a rendering fault. */
  .sheet { position: fixed; inset: 0; z-index: 90; display: flex;
           align-items: flex-end; background: rgba(0,0,0,.55); }
  .sheet.hidden { display: none; }
  .sheetInner {
    width: 100%; background: var(--surface);
    border-top: none; border-radius: 28px 28px 0 0;
    padding: 20px 18px 28px; max-height: 82vh; overflow-y: auto;
    box-shadow: 0 -8px 40px rgba(0,0,0,.55);
  }
  /* Material bottom sheets carry a drag handle; it also reads as "this can be
     dismissed", which the bare sheet did not. */
  .sheetInner::before {
    content: ''; display: block; width: 34px; height: 4px;
    background: var(--surface-3); border-radius: 99px;
    margin: -6px auto 14px;
  }
  .sheetHead {
    display: flex; align-items: center; font-size: 14px;
    font-weight: 700; margin-bottom: 12px;
  }
  .sheetHead .x {
    margin-left: auto; background: none; border: none;
    color: var(--text-muted); font-size: 17px; padding: 4px 8px;
  }
  .dRow {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 8px 0; border-bottom: 1px solid #1e242c; font-size: 13px;
  }
  .dRow:last-of-type { border-bottom: none; }
  .dKey { color: var(--text-muted); flex-shrink: 0; }
  .dVal { text-align: right; font-variant-numeric: tabular-nums; }
  .dBig {
    font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
    margin-bottom: 2px;
  }
  .dShot {
    width: 100%; border-radius: 10px; margin: 10px 0 4px;
    border: 1px solid var(--card-border);
  }
  .dActions { display: flex; gap: 8px; margin-top: 16px; }
  .dActions button {
    flex: 1 1 0; padding: 13px 8px; border-radius: 99px; font-size: 13px;
    font-weight: 600; background: var(--surface-2); border: none;
    color: var(--text-primary); font-family: inherit;
  }
  .dActions button:active { background: var(--surface-3); }
  .dActions button.go { background: var(--accent-blue); color: #0b0f14; }

  /* Delete sits apart from the actions that ADD to the record, and is styled
     down rather than up: it is destructive and irreversible, so it should
     never be the thing the eye lands on first. */
  .dDanger {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid var(--card-border); text-align: center;
  }
  .dDel {
    background: none; border: none; color: var(--accent-red);
    font-size: 13px; font-family: inherit; padding: 8px 14px;
    border-radius: 99px;
  }
  .dDel:active { background: #3a1f1f; }
  .dDelGo { background: #5c1d1a !important; color: var(--accent-red) !important; }

  /* The confirm step. States plainly what will happen, because it cannot be
     undone. */
  .dConfirm { padding: 6px 0 2px; }
  .dcWhat {
    font-size: 18px; font-weight: 600; text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .dcWhy {
    font-size: 13px; color: var(--text-muted); text-align: center;
    line-height: 1.55; margin-top: 10px;
  }

  /* Ask, before there is anything to ask about. */
  .askCta { margin-top: 18px; }
  .askCta button {
    background: var(--accent-blue); color: #0b0f14; border: none;
    border-radius: 99px; padding: 12px 26px; font-size: 13px;
    font-weight: 600; font-family: inherit;
  }
  .askCta button:active { background: #a8c7fa; }

  /* --- UPI ---------------------------------------------------------- */
  /* Built from the same tokens as the rest of the app: same card colours,
     same radii, same muted-label treatment. A payment screen that looked
     like a different product would undercut the trust it needs most. */
  .chip.upi { background: #10243d; color: #7cc0ff; border-color: #1b3a5e; }

  /* Scanner. The page goes transparent (body.camera) so the viewfinder shows
     through; this is the only thing painted over it. */
  .upiReticle {
    display: flex; align-items: center; justify-content: center;
    padding: 18px 0 10px;
  }
  .upiFrame {
    width: 190px; height: 190px; border-radius: 16px;
    border: 2px solid rgba(59,130,246,.9);
    box-shadow: 0 0 0 9999px rgba(0,0,0,.28);
  }

  .upiPayee { text-align: center; padding: 6px 0 12px; }
  .upiName { font-size: 15px; font-weight: 600; }
  .upiVpa {
    font-size: 12px; color: var(--text-muted); margin-top: 2px;
    word-break: break-all;
  }

  .upiAmountFixed {
    text-align: center; font-size: 34px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin: 6px 0 2px;
  }
  .upiAmountEntry {
    display: flex; align-items: center; justify-content: center;
    gap: 4px; margin: 8px 0 2px;
  }
  .upiCur { font-size: 30px; font-weight: 700; color: var(--text-muted); }
  .upiAmountEntry input {
    width: 62%; background: transparent; border: none;
    border-bottom: 2px solid #2b323c; color: var(--text-primary);
    font: 700 34px/1.1 inherit; font-variant-numeric: tabular-nums;
    text-align: center; outline: none; padding: 2px 0;
  }
  .upiAmountEntry input:focus { border-bottom-color: var(--accent-blue); }
  /* Chrome's number spinners make a payment field look like a form widget. */
  .upiAmountEntry input::-webkit-outer-spin-button,
  .upiAmountEntry input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  .upiNote {
    width: 100%; background: var(--card-bg); border: 1px solid #2b323c;
    border-radius: 9px; padding: 10px 12px; color: var(--text-primary);
    font-size: 14px; font-family: inherit; outline: none; margin-top: 14px;
  }
  .upiNote:focus { border-color: var(--accent-blue); }

  .upiNext {
    font-size: 12px; color: var(--text-muted); text-align: center;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid #1e242c;
  }
  .upiSaved { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  .upiWait { text-align: center; padding: 18px 0 10px; }
  .upiBig {
    font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }

  /* Result. The mark carries the state colour; the words carry the meaning. */
  .upiResult { text-align: center; padding: 10px 0 4px; }
  .upiMark {
    font-size: 34px; line-height: 1; margin-bottom: 8px;
    width: 58px; height: 58px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin-left: auto; margin-right: auto;
  }
  .upiResult.ok    .upiMark { background: #14532d; color: #4ade80; }
  .upiResult.bad   .upiMark { background: #45201f; color: #f87171; }
  .upiResult.warn  .upiMark { background: #3a2c10; color: #f5cd7a; }
  .upiResult.muted .upiMark { background: #1f2630; color: #9aa4b2; }
  .upiState { font-size: 13px; font-weight: 600; margin-top: 6px; }
  .upiResult.ok    .upiState { color: #4ade80; }
  .upiResult.bad   .upiState { color: #f87171; }
  .upiResult.warn  .upiState { color: var(--accent-amber); }
  .upiResult .upiName { margin-top: 10px; }

  .upiExplain {
    font-size: 12px; color: var(--text-muted); text-align: center;
    line-height: 1.5; margin: 12px 4px 0;
  }
  /* The honest line. A payment app's word is not the bank's. */
  .upiUnverified {
    font-size: 11px; color: var(--accent-amber);
    background: #2a1f10; border: 1px solid #4a3a18;
    border-radius: 7px; padding: 7px 10px; margin-top: 10px; text-align: center;
  }

  .upiCtx {
    margin-top: 16px; padding-top: 14px; border-top: 1px solid #1e242c;
  }
  .upiCtxHead { font-size: 13px; font-weight: 600; }
  .upiCtxSub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .upiCtxRow { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .upiCtxRow input {
    flex: 1 1 auto; background: var(--card-bg); border: 1px solid #2b323c;
    border-radius: 99px; padding: 10px 14px; color: var(--text-primary);
    font-size: 14px; font-family: inherit; outline: none; min-width: 0;
  }
  .upiCtxRow input:focus { border-color: var(--accent-blue); }
  .upiMic {
    width: 40px; height: 40px; border-radius: 20px; flex-shrink: 0;
    background: #1f2630; border: 1px solid #2b323c;
    color: var(--text-primary); font-size: 16px;
  }
  .upiMic.live { background: #7f1d1d; border-color: #b91c1c; }
  .upiSave {
    flex-shrink: 0; background: #1d4ed8; border: 1px solid #2563eb;
    color: #fff; border-radius: 99px; padding: 10px 16px;
    font-size: 13px; font-weight: 600; font-family: inherit;
  }

  /* --- Empty state ------------------------------------------------- */
  .zero { text-align: center; padding: 34px 16px; color: var(--text-muted); }
  .zero .icon { font-size: 30px; opacity: .5; }
  .zero .head { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-top: 8px; }
  .zero .sub { font-size: 12px; margin-top: 4px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Paper Trail</h1>
  <span class="marker" id="npuBadge" style="margin-left:auto">runtime…</span>
  <span class="marker" id="marker" style="margin-left:6px">boot</span>
</header>

<!-- Two top-level tabs. The ledger and the conversation are different modes of
     working, not two things to scroll past each other: answering a question
     used to scroll the payment list away, and the payment list pushed answers
     off screen. -->
<div class="tabs" id="mainTabs">
  <button class="tab active" data-mode="ledger">Ledger</button>
  <button class="tab" data-mode="ask">Ask <span class="tabCount" id="tabAskCount"></span></button>
</div>

<div id="modeLedger">
  <div class="clarity">
    <div class="cbox" id="boxUnexplained">
      <div class="big" id="unexCount">–</div>
      <div class="lbl">Unexplained</div>
    </div>
    <div class="cbox" id="boxStreak">
      <div class="big" id="streakDays">0</div>
      <div class="lbl">Day streak</div>
    </div>
    <div class="cbox" id="boxScore">
      <div class="big" id="clarityPct">–</div>
      <div class="lbl">Clarity</div>
    </div>
  </div>

  <!-- Filters for the one payment list. Pending / reconciled / unmerged were
       the reconciliation engine's internal queues shown as three sections; a
       person thinks in payments, so state is a property of a row instead. -->
  <div class="filters" id="tabs">
    <button class="filt active" data-view="all">All</button>
    <button class="filt" data-view="unexplained">Needs evidence <span class="tabCount" id="tabUnex">0</span></button>
    <button class="filt" data-view="done">Explained <span class="tabCount" id="tabDone">0</span></button>
  </div>

  <div id="ledger"></div>
</div>

<div id="modeAsk" style="display:none">
  <div class="feed" id="chatFeed"></div>
  <div class="zero" id="askHint">
    <div class="icon">💬</div>
    <div class="head">Ask about your spending</div>
    <div class="sub">
      "how much on petrol"<br>
      "what did I spend on food"<br>
      "did I pay twice"
    </div>
  </div>
</div>

<!-- Row detail. Opened by tapping a payment. -->
<div class="sheet hidden" id="detailSheet">
  <div class="sheetInner">
    <div class="sheetHead">
      <span id="detailTitle">Payment</span>
      <button class="x" id="detailClose">✕</button>
    </div>
    <div id="detailBody"></div>
  </div>
</div>

<!-- Fixed Bottom Smart Action Bar -->
<div class="actionBar">
  <div class="attachBar" id="attachBar" style="display:none"></div>
  <div class="actionTop">
    <input id="smartInput" type="text" placeholder="Add spend or ask a question..." enterkeyhint="send">
    <button class="actionBtn primary" id="bSend">➔</button>
    <button class="actionBtn" id="bVoice">🎙</button>
  </div>
  <div class="actionTools">
    <!-- Scan-to-pay is the product's front door, so it leads and is the only
         tool styled as a primary action. -->
    <button id="bPay" class="toolPay">▣ Scan &amp; Pay</button>
    <button id="bPhoto">📷 Receipt</button>
    <button id="bRefresh">↻ Sync SMS</button>
  </div>
</div>

<!-- JS Modules -->
<script src="js/reconcile.js"></script>
<script src="js/store.js"></script>
<script src="js/bridge.js"></script>
<script src="js/extract.js"></script>
<script src="js/capture-ui.js"></script>
<script src="js/financial-memory.js"></script>
<script src="js/intent.js"></script>
<script src="js/proof.js"></script>
<script src="js/upi.js"></script>

<script>
  var BUILD_MARKER = 'v1.1-redesign';
  var pendingConfirms = [];
  
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  /** Relative time for a payment row. Lost in an earlier rewrite. */
  function ago(ts) {
    if (!ts) return '';
    var d = Math.round((Date.now() - ts) / 1000);
    if (d < 60) return 'just now';
    if (d < 3600) return Math.round(d / 60) + 'm';
    if (d < 86400) return Math.round(d / 3600) + 'h';
    return Math.round(d / 86400) + 'd';
  }

  function money(n) {
    return '₹' + Number(n || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 });
  }

  function stamp() {
    $('marker').textContent = BUILD_MARKER + ' ' + new Date().toTimeString().slice(0, 5);
  }

  // --- Runtime Badge --------------------------------------------
  function renderRuntime() {
    var b = $('npuBadge');
    var st = PTBridge.llmStatus();
    if (st && st.available) {
      var unit = String(st.computeUnit || '').toLowerCase();
      var onNpu = unit.indexOf('npu') >= 0;
      b.className = 'marker ' + (onNpu ? 'npu' : 'cpu');
      b.textContent = (onNpu ? 'NPU' : 'CPU') + ' · Qwen3';
    } else if (st && st.loading) {
      b.className = 'marker cpu';
      b.textContent = 'Loading…';
    } else {
      b.className = 'marker off';
      b.textContent = 'Rules engine';
    }
  }

  // --- Clarity Header -------------------------------------------
  function renderClarity() {
    var un = PTMemory.unexplained(PTStore);
    var sc = PTMemory.clarityScore(PTStore);
    var st = PTMemory.clarityStreak(PTStore);

    $('unexCount').textContent = un.count;
    $('boxUnexplained').className = 'cbox ' + (un.count === 0 ? 'zero' : (un.count <= 2 ? 'warn' : 'bad'));

    $('clarityPct').textContent = sc.totalRows ? (sc.pct + '%') : '–';
    $('boxScore').className = 'cbox ' + (sc.pct >= 90 ? 'zero' : (sc.pct >= 60 ? 'warn' : 'bad'));

    $('streakDays').textContent = st.days;
    $('boxStreak').className = 'cbox ' + (st.atRisk ? 'warn' : 'zero');
  }

  // --- Chips Renderer -------------------------------------------
  function chipsFor(r) {
    var rec = {
      kind: 'reconciled',
      source: (r.pending && r.pending.source) || 'manual',
      purpose: (r.pending && r.pending.purpose) || ''
    };
    var ev = PTMemory.evidenceOf(rec);
    var html = ev.map(function (e) {
      return '<span class="chip ' + e + '">' + e.toUpperCase() + '</span>';
    }).join('');
    if (!PTMemory.isExplained(rec)) html += '<span class="chip none">no evidence</span>';
    if (rec.purpose) html += '<span class="chip purpose">' + esc(rec.purpose) + '</span>';
    return '<div class="chips">' + html + '</div>';
  }

  // --- Main Ledger Rendering ------------------------------------
  var view = 'all';

  /* Every payment as one shape, whatever state it is in.
   *
   * A row is built from three facts: what it cost, who it was with, and what
   * evidence backs it. The reconciliation engine's internal queues (pending /
   * unmerged / reconciled) become a stripe colour and a line of meta, not three
   * separate lists the user has to reconcile in their head. */
  function payments() {
    var S = PTStore, out = [];

    S.reconciled.forEach(function (r) {
      out.push({
        key: 'r:' + r.id,
        state: 'done',
        ts: (r.txn && r.txn.ts) || r.ts,
        amount: (r.txn && r.txn.amount) || r.pending.amount,
        who: r.pending.note || (r.txn && r.txn.counterparty) || '',
        meta: [(r.txn && r.txn.issuer) || 'bank',
               r.auto ? 'auto ' + Math.round(r.confidence * 100) + '%'
                      : 'confirmed'].filter(Boolean).join(' · '),
        rec: r,
        evidence: PTMemory.evidenceOf({
          kind: 'reconciled',
          source: r.pending.source,
          purpose: r.pending.purpose,
          upi: r.pending.upi
        })
      });
    });

    S.pending.forEach(function (p) {
      out.push({
        key: 'p:' + p.id,
        state: 'waiting',
        ts: p.ts,
        amount: p.amount,
        who: p.note || '',
        /* A UPI payment is not "waiting for bank SMS" in the same sense as a
         * typed spend - the payment app already reported an outcome, and the
         * SMS is the corroboration. Say which of the two we are at. */
        meta: p.upi
          ? (p.upi.state === 'VERIFIED' ? 'UPI · verified by bank'
             : p.upi.state === 'PENDING' ? 'UPI · bank still processing'
             : 'UPI · awaiting bank confirmation')
          : 'waiting for bank SMS',
        rec: p,
        evidence: PTMemory.evidenceOf({
          kind: 'pending', source: p.source, purpose: p.purpose, upi: p.upi
        })
      });
    });

    S.txns.forEach(function (t) {
      if (S.isMerged(t.id)) return;
      out.push({
        key: 't:' + t.id,
        state: 'bare',
        ts: t.ts,
        amount: t.amount,
        credit: t.direction === 'credit',
        who: t.counterparty || '',
        meta: [t.issuer || 'SMS', t.acctLast4 ? '••' + t.acctLast4 : ''].filter(Boolean).join(' · '),
        rec: t,
        evidence: ['sms']
      });
    });

    out.sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
    return out;
  }

  /** Duplicate pairs, keyed by row so a warning can sit on the row itself. */
  function duplicateKeys() {
    var map = {};
    try {
      var d = PTMemory.didIPayTwice(PTStore);
      d.pairs.forEach(function (pr) {
        map[String(pr.second.id)] = pr;
        map[String(pr.first.id)] = pr;
      });
    } catch (e) {}
    return map;
  }

  function chipHtml(ev, hasPurpose) {
    var L = { sms: 'SMS', ocr: 'RECEIPT', voice: 'VOICE', purpose: 'PURPOSE',
              upi: 'UPI' };
    var h = (ev || []).map(function (e) {
      return '<span class="chip ' + e + '">' + (L[e] || e) + '</span>';
    }).join('');
    var has = ev && (ev.indexOf('ocr') >= 0 || ev.indexOf('voice') >= 0);
    if (!has && !hasPurpose) {
      h += '<span class="chip none">no evidence</span>';
    }
    return '<div class="chips">' + h + '</div>';
  }

  function explained(p) {
    return p.evidence.indexOf('ocr') >= 0 ||
           p.evidence.indexOf('voice') >= 0 ||
           p.evidence.indexOf('purpose') >= 0;
  }

  /* The merchant's initial, the way GPay does it - a letter you recognise at a
   * glance beats a generic icon repeated down the list. Falls back to a symbol
   * only when there is genuinely no name to take a letter from. */
  function avatarFor(p) {
    if (p.credit) return '↓';
    var name = (p.who || '').replace(/[^A-Za-z0-9]/g, '');
    if (name) return esc(name.charAt(0).toUpperCase());
    return p.state === 'bare' ? '✉' : '₹';
  }

  var rowIndex = {};

  function render(flashIds) {
    flashIds = flashIds || {};
    var all = payments();
    var dups = duplicateKeys();
    rowIndex = {};

    var needs = all.filter(function (p) { return !explained(p); });
    $('tabUnex').textContent = needs.length;
    $('tabDone').textContent = all.length - needs.length;

    var shown = view === 'unexplained' ? needs
              : view === 'done' ? all.filter(explained)
              : all;

    // Confirm prompts stay at the top: they are the only thing needing a decision.
    var html = pendingConfirms.map(function (c, i) {
      return '<div class="pay" style="border-left-color:var(--accent-purple)">' +
        '<div class="payTop"><span class="payAmt">' + money(c.pending.amount) + '</span>' +
        '<span class="payWho">' + esc(c.pending.note || c.pending.source) + '</span></div>' +
        '<div class="payMeta">possible match: ' + money(c.cand.txn.amount) + ' ' +
          esc(c.cand.txn.counterparty || '') + ' · ' +
          Math.round(c.cand.confidence * 100) + '%</div>' +
        '<div class="dActions"><button class="go" onclick="event.stopPropagation();doConfirm(' + i + ')">Merge</button>' +
        '<button onclick="event.stopPropagation();dismissConfirm(' + i + ')">Not this</button></div>' +
      '</div>';
    }).join('');

    html += shown.map(function (p) {
      rowIndex[p.key] = p;
      var dup = dups[String(p.rec.id)];
      var cls = 'pay ' + (dup ? 'dup' : p.state) +
                (flashIds[p.rec.id] ? ' flash' : '');
      var who = p.who
        ? '<span class="payWho">' + esc(p.who) + '</span>'
        : '<span class="payWho unknown">unlabelled payment</span>';
      return '<div class="' + cls + '" onclick="openDetail(&quot;' + p.key + '&quot;)">' +
        '<div class="payIcon">' + avatarFor(p) + '</div>' +
        '<div class="payMain">' +
          '<div class="payTop">' +
            who +
            '<span class="payAmt' + (p.credit ? ' credit' : '') + '">' +
              (p.credit ? '+' : '') + money(p.amount) + '</span>' +
          '</div>' +
          '<div class="payMeta">' + esc(p.meta) + ' · ' + ago(p.ts) + '</div>' +
          (dup ? '<div class="payWarn">⚠ possible duplicate · ' +
                 Math.round(dup.gapMs / 60000) + ' min apart</div>' : '') +
          chipHtml(p.evidence, p.rec.purpose) +
        '</div>' +
      '</div>';
    }).join('');

    $('ledger').innerHTML = html || emptyState();
    renderClarity();
    renderAskTab();
  }

  /** The Ask tab shows a lock until there is something to answer from. */
  function renderAskTab() {
    syncAskTabClass();
    // If the lock fell while sitting on the tab, refresh the pane under it.
    if (mode === 'ask' && !askReady()) renderAskLocked();
  }

  /** Empty states say what to do next, not just that there is nothing. */
  function emptyState() {
    if (view === 'unexplained') {
      return '<div class="zero"><div class="icon">✓</div>' +
        '<div class="head">Everything is explained</div>' +
        '<div class="sub">Every payment has a receipt, a voice note or a purpose.</div></div>';
    }
    if (view === 'done') {
      return '<div class="zero"><div class="icon">◌</div>' +
        '<div class="head">Nothing explained yet</div>' +
        '<div class="sub">Attach a receipt or say what a payment was for.</div></div>';
    }
    return '<div class="zero"><div class="icon">₹</div>' +
      '<div class="head">No payments yet</div>' +
      '<div class="sub">Type a spend below, photograph a receipt,<br>or tap the mic and say it.</div></div>';
  }

  /* --- Detail sheet ------------------------------------------------
   * Tapping a payment was previously inert. The evidence chips claimed a
   * receipt existed but there was no way to see it, which undercut the whole
   * point of the product. */
  function openDetail(key) {
    var p = rowIndex[key];
    if (!p) return;
    var r = p.rec;
    var rows = [];

    function line(k, v) {
      if (v == null || v === '') return;
      rows.push('<div class="dRow"><span class="dKey">' + esc(k) +
                '</span><span class="dVal">' + esc(String(v)) + '</span></div>');
    }

    var txn = p.state === 'done' ? r.txn : (p.state === 'bare' ? r : null);
    var pend = p.state === 'done' ? r.pending : (p.state === 'waiting' ? r : null);

    line('When', new Date(p.ts).toLocaleString('en-IN'));
    if (txn) {
      line('Bank', txn.issuer);
      line('Account', txn.acctLast4 ? '••' + txn.acctLast4 : '');
      line('Merchant', txn.counterparty);
      line('Reference', txn.ref);
      line('Direction', txn.direction);
    }
    if (pend) {
      line('You said', pend.note);
      line('Purpose', pend.purpose);
      line('Captured by', pend.source);
    }

    /* UPI facts. The state line is the important one: it must never read as
     * more certain than the evidence actually is. */
    var u = pend && pend.upi;
    if (u) {
      line('Paid to', u.payeeName);
      line('UPI ID', u.vpa);
      line('Status', PTUpi.LABEL[u.state] || u.state);
      line('Paper Trail ref', u.refId);
      line('UPI transaction', u.upiTxnId);
      line('Bank ref (RRN)', u.upiRefNumber);
      if (u.contextText) {
        line('You said after paying', u.contextText);
        line('Heard by', u.contextSource === 'voice' ? 'voice' : 'typed');
      }
      if (u.contextNote) line('Detail', u.contextNote);
    }
    if (p.state === 'done') {
      line('Match confidence', Math.round(r.confidence * 100) + '%');
      line('Why it matched', (r.reasons || []).join(', '));
    }

    var shot = '';
    if (pend && pend.path) {
      shot = '<img class="dShot" src="file://' + pend.path + '" onerror="this.remove()">';
    }

    $('detailTitle').textContent =
      p.state === 'done' ? 'Reconciled payment'
      : p.state === 'waiting' ? 'Awaiting bank SMS'
      : 'Bank payment';

    $('detailBody').innerHTML =
      '<div class="dBig">' + money(p.amount) + '</div>' +
      '<div class="payMeta" style="margin-bottom:10px">' +
        esc(p.who || 'unlabelled payment') + '</div>' +
      chipHtml(p.evidence, pend && pend.purpose) +
      shot +
      '<div style="margin-top:12px">' + rows.join('') + '</div>' +
      /* Speaking is the fastest way to explain a payment and was previously
       * only reachable by tapping the mic in the action bar after the sheet
       * had closed - so the obvious route from "this needs evidence" to
       * saying what it was for did not exist. */
      (explained(p) ? '' :
        '<div class="dActions">' +
          '<button class="go" onclick="explainBy(&quot;' + key + '&quot;,&quot;voice&quot;)">🎙 Say it</button>' +
          '<button onclick="explainBy(&quot;' + key + '&quot;,&quot;photo&quot;)">📷 Receipt</button>' +
          '<button onclick="explainThis(&quot;' + key + '&quot;)">⌨ Type</button>' +
        '</div>') +
      /* Deleting is destructive and irreversible, so it is visually quiet and
       * sits apart from the actions that add to the record. */
      '<div class="dDanger">' +
        '<button class="dDel" onclick="confirmDelete(&quot;' + key + '&quot;)">Delete this entry</button>' +
      '</div>';

    $('detailSheet').className = 'sheet';
  }

  /**
   * Explain a payment straight into a capture mode.
   *
   * Sets the attach target first, so whatever comes back lands on THIS payment
   * rather than creating a new one, then opens the capture UI directly.
   */
  function explainBy(key, how) {
    closeDetail();
    var p = rowIndex[key];
    if (!p) return;
    attachTarget = p;
    setMode('ledger');
    showAttachBar(p);
    if (how === 'voice') PTCapture.startVoice();
    else PTCapture.startPhoto();
  }

  function closeDetail() { $('detailSheet').className = 'sheet hidden'; }

  /** From a row straight into capture, so the count has a route to zero. */
  /* --- Attaching evidence to a specific payment --------------------
   *
   * "Add evidence" previously only changed the input placeholder. Whatever the
   * user typed next went through the normal capture path and created a SECOND
   * pending entry, so explaining a payment silently duplicated it and the
   * unexplained count never fell.
   *
   * There is now an explicit target. While it is set, typed text, a photo or a
   * voice note attach to THAT payment instead of creating a new one. */
  var attachTarget = null;

  function explainThis(key) {
    closeDetail();
    var p = rowIndex[key];
    if (!p) return;
    attachTarget = p;
    setMode('ledger');
    showAttachBar(p);
    $('smartInput').placeholder = 'What was ' + money(p.amount) + ' for?';
    $('smartInput').focus();
  }

  /** A visible banner, so it is obvious the next input is not a new spend. */
  function showAttachBar(p) {
    var bar = $('attachBar');
    bar.innerHTML =
      '<span class="aWho">Explaining ' + money(p.amount) +
        (p.who ? ' · ' + esc(p.who) : '') + '</span>' +
      '<button class="aCancel" onclick="cancelAttach()">Cancel</button>';
    bar.style.display = 'flex';
  }

  function cancelAttach() {
    attachTarget = null;
    $('attachBar').style.display = 'none';
    $('smartInput').placeholder = mode === 'ask'
      ? 'Ask about your spending...' : 'Add a spend, e.g. 250 for lunch';
  }

  /* --- Deleting an entry -------------------------------------------
   *
   * Things get added by accident - a misheard amount, a duplicate capture, a
   * wrong tap - and without a way back the ledger becomes something the user
   * stops trusting.
   *
   * Deleting always confirms first: it cannot be undone, and the whole point
   * of the product is that the record is reliable. */
  function confirmDelete(key) {
    var p = rowIndex[key];
    if (!p) return;
    var what = money(p.amount) + (p.who ? ' · ' + p.who : '');
    $('detailTitle').textContent = 'Delete this entry?';
    $('detailBody').innerHTML =
      '<div class="dConfirm">' +
        '<div class="dcWhat">' + esc(what) + '</div>' +
        '<div class="dcWhy">' +
          (p.state === 'bare'
            ? 'This came from a bank SMS. Deleting hides it from your ledger — ' +
              'it will not come back on the next sync, and the message itself is untouched.'
            : 'This will be removed from your ledger. This cannot be undone.') +
        '</div>' +
      '</div>' +
      '<div class="dActions">' +
        '<button class="dDelGo" onclick="doDelete(&quot;' + key + '&quot;)">Delete</button>' +
        '<button onclick="openDetail(&quot;' + key + '&quot;)">Keep</button>' +
      '</div>';
  }

  function doDelete(key) {
    var p = rowIndex[key];
    if (!p) return;
    var ok = PTStore.remove(p.state, p.rec);
    closeDetail();
    if (!ok) return;
    render();
    appendChat('<div class="a">Deleted ' + money(p.amount) +
      (p.who ? ' · ' + esc(p.who) : '') + '</div>', 'llm');
    setMode('ledger');
  }

  /**
   * Attach evidence to the targeted payment.
   *
   * A bank row (state 'bare') has no capture to carry the note, so one is
   * created and merged with that exact transaction - which is what the user
   * meant by explaining it. A pending or reconciled row just gains the purpose.
   */
  function applyAttach(text, extra) {
    var p = attachTarget;
    if (!p) return false;
    var purpose = (text || '').trim();
    var path = extra && extra.path;
    if (!purpose && !path) return false;

    if (p.state === 'bare') {
      var t = p.rec;
      var pend = PTStore.addPending({
        amount: t.amount,
        note: purpose || t.counterparty || 'evidence',
        purpose: purpose,
        source: (extra && extra.source) || 'manual',
        path: path || null,
        ts: t.ts,
        direction: t.direction || 'debit'
      });
      // Bind to the transaction the user actually tapped, rather than letting
      // the matcher pick a different row with the same amount.
      PTStore.confirmMerge(pend.id, t.id);
    } else {
      var rec = p.state === 'done' ? p.rec.pending : p.rec;
      if (purpose) {
        rec.purpose = purpose;
        if (!rec.note || rec.note === 'Capture') rec.note = purpose;
      }
      if (path) rec.path = path;
      /* Record HOW the explanation arrived, whether or not a file came with it.
       *
       * This was inside the `if (path)` above, so a spoken explanation only
       * counted as voice when a WAV happened to exist - and it usually does
       * not, because the recogniser owns the mic and no clip is recorded. The
       * result was a payment explained out loud that showed a PURPOSE chip but
       * never a VOICE one, understating the evidence the user actually gave. */
      var src = extra && extra.source;
      if (src === 'voice' || src === 'photo') rec.source = src;
    }

    PTStore.save();
    var flash = {}; flash[p.rec.id] = 1;
    cancelAttach();
    render(flash);
    appendChat('<div class="a">Attached to <b>' + money(p.amount) + '</b>' +
      (purpose ? ' · ' + esc(purpose) : '') + '</div>', 'llm');
    setMode('ledger');
    return true;
  }


  function doConfirm(i) {
    var c = pendingConfirms[i];
    if (!c) return;
    var m = PTStore.confirmMerge(c.pending.id, c.cand.txn.id);
    PTStore.save();
    pendingConfirms.splice(i, 1);
    var flash = {}; if (m) flash[m.id] = 1;
    render(flash);
  }
  function dismissConfirm(i) { pendingConfirms.splice(i, 1); render(); }

  // --- Conversational Feed Append -------------------------------
  function appendChat(text, type, extraClass) {
    /* An answer belongs in the Ask tab; switch there so it is not written to a
     * pane the user cannot see - but never onto the locked empty state, which
     * would leave a confirmation stranded under a "nothing to ask about"
     * heading. Confirmations for ledger actions stay on the ledger. */
    if (typeof setMode === 'function' && mode !== 'ask') {
      if (!askReady()) return;
      setMode('ask');
    }
    var hint = $('askHint');
    if (hint) hint.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'chatMsg ' + (type === 'user' ? 'chatUser' : 'chatLlm') + (extraClass ? ' ' + extraClass : '');
    div.innerHTML = text;
    $('chatFeed').appendChild(div);
    /* Scroll the NEW MESSAGE into view, not the bottom of the document.
     *
     * scrollTo(scrollHeight) jumped past the entire payment list on every
     * input, so answering a question threw the user to the oldest row. The feed
     * sits above the ledger, so the answer is what should be on screen. */
    div.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // --- Unified Smart Input Handler -----------------------------
  /** Shared row list under an answer, so every result looks the same. */
  function rowsHtml(rows) {
    if (!rows || !rows.length) return '';
    var h = '<div class="rows">';
    for (var i = 0; i < Math.min(4, rows.length); i++) {
      var r = rows[i];
      h += '• ' + money(r.amount) + ' — ' +
           esc(r.purpose || r.note || r.merchant || 'spend') +
           (r.ref ? ' (ref ' + esc(r.ref) + ')' : '') + '<br>';
    }
    if (rows.length > 4) h += '...and ' + (rows.length - 4) + ' more';
    return h + '</div>';
  }

  /** The "Thinking..." bubble is removed when the real answer lands. */
  function removePending() {
    var p = document.querySelector('.chatLlm.pending');
    if (p) p.parentNode.removeChild(p);
  }

  function handleSmartInput(text) {
    if (!text) return;
    // An open attach target claims the input: this is an explanation of an
    // existing payment, not a new one.
    if (attachTarget && applyAttach(text)) return;
    appendChat(esc(text), 'user');

    PTIntent.route(text, function(res) {
      PTBridge.log('route intent=' + res.intent + ' via=' + res.via + ' q=' + (res.queryName || '-'));

      if (res.intent === 'query') {
        /* Free-form questions go through RAG: deterministic retrieval and
         * totalling, then the model phrases the answer from those rows only.
         * Structured questions (duplicates, references, unexplained) keep their
         * exact deterministic answers. */
        if (res.queryName && res.queryName !== 'spendByPurpose') {
          var ans = PTIntent.runQuery(res, PTStore);
          var dup = ans.query === 'didIPayTwice' && ans.count > 0;
          var h = '<div class="q">Query Result</div>';
          h += '<div class="a">' + esc(PTIntent.describe(ans)) + '</div>';
          h += rowsHtml(ans.rows);
          appendChat(h, 'llm', dup ? 'dupWarn' : '');
          return;
        }

        appendChat('<div class="q">Thinking…</div>', 'llm', 'pending');
        PTIntent.askLedger(text, PTStore, function (a) {
          removePending();
          var h = '<div class="q">Answer • ' + esc(a.via) +
                  (a.ms ? ' · ' + a.ms + 'ms' : '') + '</div>';
          h += '<div class="a">' + esc(a.answer) + '</div>';
          h += rowsHtml(a.rows);
          appendChat(h, 'llm');
        });

      } else if (res.intent === 'capture') {
        var amt = res.amount;
        if (!amt || !(amt > 0)) {
          appendChat('<div class="a">No amount recognized in "' + esc(text) + '". Try e.g. "250 for lunch".</div>', 'llm');
          return;
        }

        var p = PTStore.addPending({
          amount: amt,
          note: res.note || res.purpose || 'Capture',
          purpose: res.purpose || '',
          source: res.via === 'llm' ? 'voice' : 'manual'
        });
        PTStore.save();
        
        // Auto-reconcile with SMS
        var rows = PTBridge.readSms(200);
        PTStore.setTxns(rows);
        var recRes = PTStore.reconcileAll();
        pendingConfirms = recRes.confirm;
        PTStore.save();

        var flash = {};
        recRes.merged.forEach(function(m){ flash[m.id] = 1; });
        
        var msg = 'Captured <b>' + money(p.amount) + '</b> for <i>' + esc(p.note) + '</i>';
        if (recRes.merged.length > 0) msg += ' • Auto-merged with Bank SMS!';
        appendChat('<div class="a">' + msg + '</div>', 'llm');
        render(flash);

      } else if (res.intent === 'context') {
        var p = res.purpose;
        if (!p) {
          appendChat('<div class="a">Could not extract category label.</div>', 'llm');
          return;
        }
        var target = PTStore.pending.length
          ? PTStore.pending[PTStore.pending.length - 1]
          : (PTStore.reconciled.length ? PTStore.reconciled[PTStore.reconciled.length - 1].pending : null);

        if (target) {
          target.purpose = p;
          PTStore.save();
          appendChat('<div class="a">Attached label <b>"' + esc(p) + '"</b> to recent spend of ' + money(target.amount) + '.</div>', 'llm');
          render();
        } else {
          appendChat('<div class="a">No spend available to tag with "' + esc(p) + '".</div>', 'llm');
        }
      }
    });
  }

  // --- Input & Button Events -----------------------------------
  function submitInput() {
    var val = $('smartInput').value.trim();
    if (val) {
      $('smartInput').value = '';
      handleSmartInput(val);
    }
  }

  $('bSend').onclick = submitInput;
  $('smartInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') submitInput();
  });

  /* Sync and reconcile are one action now: reading SMS and then NOT matching
     it against the ledger was never something a user wanted separately, and
     the freed slot went to Scan & Pay. */
  $('bRefresh').onclick = function() {
    var rows = PTBridge.readSms(200);
    PTStore.setTxns(rows);
    var r = PTStore.reconcileAll();
    pendingConfirms = r.confirm;
    // A UPI payment matched to a bank SMS is corroborated by evidence the
    // payment app did not produce - that is what verification means.
    var verified = PTStore.verifyMergedUpi();
    PTStore.save();
    var flash = {};
    r.merged.forEach(function(m){ flash[m.id] = 1; });
    render(flash);
    if (verified.length) {
      appendChat('<div class="a">Bank SMS confirmed ' + verified.length +
        ' UPI payment' + (verified.length === 1 ? '' : 's') + '.</div>', 'llm');
    }
    stamp();
  };

  /* Ask needs something to answer from.
   *
   * Every answer is retrieved from explained records - a payment with no
   * purpose, receipt or voice note contributes nothing but a number with no
   * meaning. Opening Ask against an empty ledger produces confident-sounding
   * "nothing recorded" replies that read as the feature being broken, so the
   * tab says plainly what it needs instead. */
  function askReady() {
    var all = payments();
    for (var i = 0; i < all.length; i++) if (explained(all[i])) return true;
    return false;
  }

  /* Mode tabs switch between the ledger and the conversation. */
  var mode = 'ledger';
  function setMode(m) {
    // Refuse the switch rather than showing a dead tab, and say why.
    if (m === 'ask' && !askReady()) {
      renderAskLocked();
      m = 'ask';
    }
    mode = m;
    Array.prototype.forEach.call(document.querySelectorAll('#mainTabs .tab'), function (x) {
      x.className = 'tab' + (x.getAttribute('data-mode') === m ? ' active' : '');
    });
    $('modeLedger').style.display = m === 'ledger' ? '' : 'none';
    $('modeAsk').style.display = m === 'ask' ? '' : 'none';
    var locked = m === 'ask' && !askReady();
    $('smartInput').disabled = locked;
    $('smartInput').placeholder = locked
      ? 'Explain a payment first'
      : (m === 'ask' ? 'Ask about your spending...'
                     : 'Add a spend, e.g. 250 for lunch');
    if (m === 'ask') $('askHint').style.display =
      (!locked && $('chatFeed').children.length) ? 'none' : '';
    // Keep the tab's own locked styling in step with the pane it just showed.
    syncAskTabClass();
  }

  /** The 🔒 marker on the Ask tab itself. */
  function syncAskTabClass() {
    var ready = askReady();
    var tab = document.querySelector('#mainTabs .tab[data-mode="ask"]');
    if (!tab) return;
    tab.className = 'tab' + (mode === 'ask' ? ' active' : '') + (ready ? '' : ' locked');
    tab.firstChild.nodeValue = ready ? 'Ask ' : '🔒 Ask ';
  }

  /** What the Ask tab shows before there is anything worth asking about. */
  function renderAskLocked() {
    var un = PTMemory.unexplained(PTStore).count;
    $('chatFeed').innerHTML = '';
    $('askHint').style.display = '';
    $('askHint').innerHTML =
      '<div class="icon">🔒</div>' +
      '<div class="head">Nothing to ask about yet</div>' +
      '<div class="sub">' +
        'Ask answers from payments you have explained — a receipt, a voice note ' +
        'or a purpose.<br><br>' +
        (un > 0
          ? 'You have <b>' + un + '</b> payment' + (un === 1 ? '' : 's') +
            ' waiting. Tap one and say what it was for.'
          : 'Record a payment first, then explain what it was for.') +
      '</div>' +
      '<div class="askCta"><button onclick="goExplain()">' +
        (un > 0 ? 'Explain a payment' : 'Go to Ledger') + '</button></div>';
  }

  /** Straight to the payments that need evidence - the route out of the lock. */
  function goExplain() {
    setMode('ledger');
    var f = document.querySelector('.filt[data-view="unexplained"]');
    if (f) f.click();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#mainTabs .tab'), function (b) {
    b.onclick = function () { setMode(b.getAttribute('data-mode')); };
  });

  // Filters slice the one payment list; they do not navigate anywhere.
  Array.prototype.forEach.call(document.querySelectorAll('.filt'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.filt'), function (x) {
        x.className = 'filt';
      });
      b.className = 'filt active';
      view = b.getAttribute('data-view');
      render();
    };
  });
  $('detailClose').onclick = closeDetail;
  $('detailSheet').onclick = function (e) {
    if (e.target === $('detailSheet')) closeDetail();
  };

  $('bPhoto').onclick = function() { PTCapture.startPhoto(); };
  $('bVoice').onclick = function() { PTCapture.startVoice(); };
  $('bPay').onclick = function() { PTUpi.startScan(); };

  /* A finished UPI payment lands in the ledger like any other spend, then is
   * matched against bank SMS by the existing engine. No second transaction
   * system, and no reconciliation logic duplicated here. */
  PTUpi.onDone(function (txn) {
    syncUpiIntoLedger();
    setMode('ledger');
    var entry = PTStore.findByUpiId(txn.id);
    var flash = {};
    if (entry) flash[entry.id] = 1;
    render(flash);
  });

  function syncUpiIntoLedger() {
    var rows = PTBridge.upiTransactions();
    PTStore.syncUpi(rows);
    var r = PTStore.reconcileAll();
    pendingConfirms = r.confirm;
    PTStore.verifyMergedUpi();
    PTStore.save();
    return r;
  }

  // Voice/Photo Callbacks
  PTCapture.onIntent(function(intent, text) {
    /* An open attach target claims the utterance FIRST.
     *
     * "this was for lunch" classifies as `context`, and context/query
     * utterances return through onIntent instead of onResult - so while
     * explaining a payment the mic used to route into handleSmartInput and
     * create a SECOND entry, which is the exact duplication the attach flow
     * exists to prevent. The words are the explanation; whatever they classify
     * as is irrelevant once the user has said which payment they are about. */
    if (attachTarget) {
      if (applyAttach(text, { source: 'voice' })) return;
    }
    if (intent.intent === 'query') {
      PTIntent.runQueryAsync(intent, PTStore, function (result) {
        appendChat('<div class="q">Voice Query</div><div class="a">' +
          esc(PTIntent.describe(result)) + '</div>', 'llm');
      });
    } else if (intent.purpose) {
      handleSmartInput(text);
    }
  });

  PTCapture.onResult(function(kind, r) {
    if (attachTarget) {
      // A receipt or voice note captured while explaining a payment belongs to
      // THAT payment, not to a new pending entry.
      if (applyAttach(r.note || r.purpose || '', { path: r.path, source: kind })) return;
    }
    var amt = r.amount;
    if (amt != null && amt > 0) {
      var p = PTStore.addPending({
        amount: amt,
        note: r.note || kind,
        purpose: r.purpose || '',
        source: kind,
        path: r.path
      });
      PTStore.save();
      var rRes = PTStore.reconcileAll();
      pendingConfirms = rRes.confirm;
      PTStore.save();
      appendChat('<div class="a">Captured ' + money(p.amount) + ' via ' + kind + '</div>', 'llm');
      render();
    }
  });

  // --- Safe Native Push Gateway (ADR-003) -----------------------
  window.PTOnEvent = function(name, payload) {
    try {
      if (name === 'sms') {
        var rows = PTBridge.asObj(payload, []);
        PTStore.setTxns(rows || []);
        var r = PTStore.reconcileAll();
        pendingConfirms = r.confirm;
        PTStore.save();
        render();
        return;
      }
      if (name === 'capture') {
        var r = PTBridge.asObj(payload, { ok: false });
        if (window.__ptCaptureCb) { var cb = window.__ptCaptureCb; window.__ptCaptureCb = null; cb(r); }
        return;
      }
      if (name === 'cameraOpen') {
        var c = PTBridge.asObj(payload, { ok: false });
        if (window.__ptCameraCb) { var cc = window.__ptCameraCb; window.__ptCameraCb = null; cc(c); }
        return;
      }
      if (name === 'upiQr') {
        /* The scanner keeps running until a payable code is accepted, so this
         * callback is NOT cleared - unlike the one-shot capture callbacks
         * above, it fires once per detected code. */
        var q = PTBridge.asObj(payload, { ok: false });
        if (window.__ptQrCb) window.__ptQrCb(q);
        return;
      }
      if (name === 'upiContext') {
        var uc = PTBridge.asObj(payload, { ok: false });
        if (window.__ptUpiCtxCb) {
          var ucb = window.__ptUpiCtxCb; window.__ptUpiCtxCb = null; ucb(uc);
        }
        return;
      }
      if (name === 'vision') {
        var v = PTBridge.asObj(payload, { ok: false });
        if (window.__ptVisionCb) { var vc = window.__ptVisionCb; window.__ptVisionCb = null; vc(v); }
        return;
      }
      if (name === 'transcript') {
        var t = PTBridge.asObj(payload, { ok: false });
        if (window.__ptTranscriptCb) { var tc = window.__ptTranscriptCb; window.__ptTranscriptCb = null; tc(t); }
        return;
      }
      if (name === 'answer') {
    var ar = PTBridge.asObj(payload, { ok: false });
    if (window.__ptAnswerCb) { var ac = window.__ptAnswerCb; window.__ptAnswerCb = null; ac(ar); }
    return;
  }
  if (name === 'intent') {
        var ir = PTBridge.asObj(payload, { ok: false });
        if (window.__ptIntentCb) { var ic = window.__ptIntentCb; window.__ptIntentCb = null; ic(ir); }
        return;
      }
      if (name === 'partial') {
        var pp = PTBridge.asObj(payload, {});
        if (window.__ptPartialCb && pp.text) window.__ptPartialCb(pp.text);
        return;
      }
      if (name === 'permissions') {
        var rows = PTBridge.readSms(200);
        PTStore.setTxns(rows);
        render();
      }
    } catch(err) {
      PTBridge.log('PTOnEvent error in handler for ' + name + ': ' + err);
    }
  };

  // --- Boot Initialization -------------------------------------
  stamp();
  PTStore.load();
  PTProof.load();
  var initialSms = PTBridge.readSms(200);
  PTStore.setTxns(initialSms);
  /* UPI transactions are read from native storage on every boot, not held in
   * the page. Returning from a UPI app reloads this page, so anything kept
   * here would be gone exactly when it matters most. */
  syncUpiIntoLedger();
  var bootRec = PTStore.reconcileAll();
  pendingConfirms = bootRec.confirm;
  PTStore.save();
  render();

  /* The return path. If a payment came back while we were away, show its
   * result now - this is the resume after the UPI app handed control back. */
  PTUpi.checkPendingResult();
  renderRuntime();
  setTimeout(renderRuntime, 3000);
  setTimeout(renderRuntime, 8000);
  PTBridge.log('ui ready device=' + PTBridge.isDevice + ' restored=' + PTStore.reconciled.length + 'r/' + PTStore.pending.length + 'p');
</script>
</body>
</html>
